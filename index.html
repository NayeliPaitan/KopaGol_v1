<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campeonato Categoría Libre · Posiciones</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
<style>
:root{--bg:#f3f6f1;--card:#fff;--ink:#14281d;--mute:#5c6f63;--line:#d9e2da;--accent:#0f7a3d;--up:#e8f4ec;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1a13;--card:#15251b;--ink:#e8f1ea;--mute:#93a79a;--line:#25392d;--accent:#3ecf7a;--up:#1b3526;--bad:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:860px;margin:0 auto;padding:20px 14px 48px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.7rem,6vw,2.6rem);margin:8px 0 2px;letter-spacing:-.5px}
.sub{color:var(--mute);margin:0 0 20px}
h2{font-family:Georgia,serif;font-size:1.3rem;margin:30px 0 10px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:540px}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-size:.8rem;color:var(--mute);font-weight:600}
td.eq,th.eq{text-align:left;padding-left:14px}
td.eq{font-weight:700}
td.pts{font-weight:800;font-size:1.05rem;color:var(--accent)}
tr:last-child td{border-bottom:0}
tr.top td{background:var(--up)}
.pos{display:inline-block;width:1.6em;color:var(--mute);font-weight:400}
.fecha{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.fecha h3{margin:0;padding:10px 14px;font-size:.95rem;border-bottom:1px solid var(--line);background:var(--up)}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.m .l{text-align:right}.m .v{text-align:left}
.sc{font-weight:800;font-size:1.1rem;background:var(--bg);padding:2px 12px;border-radius:6px;white-space:nowrap}
.m button{grid-column:1/-1;justify-self:end}
.adm{background:var(--card);border:2px dashed var(--accent);border-radius:10px;padding:14px;margin-top:24px}
.adm .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
select,input,button,textarea{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=number]{width:60px}
.sc input{width:48px;padding:4px;text-align:center}
button{cursor:pointer;background:var(--accent);color:#fff;border:0;font-weight:700}
button.x{background:transparent;color:var(--bad);font-weight:400;padding:2px 6px;font-size:.8rem}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;height:120px;font-family:monospace;font-size:.78rem}
.note{font-size:.85rem;color:var(--mute)}
footer{margin-top:28px;font-size:.8rem;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Categoría Libre</h1>
<p class="sub" id="sub"></p>

<h2>Tabla de posiciones</h2>
<div class="wrap"><table>
<thead><tr><th class="eq">Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead>
<tbody id="tabla"></tbody></table></div>
<p class="note">Orden: puntos, diferencia de gol y goles a favor.</p>

<h2>Resultados</h2>
<div id="fechas"></div>

<section class="adm" id="adm" hidden>
<strong>Registrar partido</strong>
<div class="row">
<select id="f"></select>
<select id="lo"></select>
<input type="number" id="gl" min="0" value="0" aria-label="Goles local">
<span>–</span>
<input type="number" id="gv" min="0" value="0" aria-label="Goles visita">
<select id="vi"></select>
<button id="add">Agregar partido</button>
</div>
<p class="note" id="msg">Cada marcador se guarda al instante. Puedes corregir un marcador directamente en la lista de resultados.</p>
<div class="row"><button id="seed" class="x">Cargar datos iniciales del archivo</button></div>
</section>

<footer>Blake Dev - NP </footer>
</main>

<script>
/* ===== DATOS: edita aquí (o usa el modo admin y pega el resultado) ===== */
const EQUIPOS=["EL CARTEL BB","LOS PINOS","ETIQUETA AZUL","VELEZ F.C","REAL KALI","SED F.C","LA FAMILIA F.C","ATLETICO AÑO NUEVO"];
const BASE=[
// [fecha, local, golesLocal, golesVisita, visita]
[1,"EL CARTEL BB",6,1,"LOS PINOS"],[1,"ETIQUETA AZUL",4,0,"VELEZ F.C"],[1,"REAL KALI",2,6,"SED F.C"],[1,"LA FAMILIA F.C",3,3,"ATLETICO AÑO NUEVO"],
[2,"REAL KALI",2,2,"ETIQUETA AZUL"],[2,"ATLETICO AÑO NUEVO",5,3,"LOS PINOS"],[2,"SED F.C",2,2,"LA FAMILIA F.C"],[2,"EL CARTEL BB",2,0,"VELEZ F.C"],
[3,"VELEZ F.C",0,4,"LOS PINOS"],[3,"LA FAMILIA F.C",4,5,"ETIQUETA AZUL"],[3,"REAL KALI",2,3,"EL CARTEL BB"],[3,"ATLETICO AÑO NUEVO",4,4,"SED F.C"],
[4,"VELEZ F.C",2,2,"REAL KALI"],[4,"SED F.C",4,5,"LOS PINOS"],[4,"EL CARTEL BB",3,3,"LA FAMILIA F.C"],[4,"ETIQUETA AZUL",6,0,"ATLETICO AÑO NUEVO"],
[5,"VELEZ F.C",3,2,"LA FAMILIA F.C"],[5,"REAL KALI",6,1,"LOS PINOS"],[5,"ETIQUETA AZUL",1,2,"SED F.C"],[5,"EL CARTEL BB",4,3,"ATLETICO AÑO NUEVO"]
];
/* ===== FIN DATOS ===== */

/* ===== CONFIGURACIÓN ===== */
const DB_URL="https://kopagol-1901-default-rtdb.firebaseio.com";  
const PIN="192001";    
const FECHAS=10;   


const ADMIN=location.hash==="#admin";
const KEY="liga-libre-local";
let PARTIDOS=BASE.map(x=>x.slice());
const $=id=>document.getElementById(id);
const msg=t=>{const m=$("msg");if(m)m.textContent=t};

async function cargar(){
  if(DB_URL){
    try{const d=await (await fetch(DB_URL+"/partidos.json")).json();if(d)PARTIDOS=Object.values(d)}
    catch(e){msg("No se pudo conectar con la base de datos.")}
  }else if(ADMIN){try{const s=localStorage.getItem(KEY);if(s)PARTIDOS=JSON.parse(s)}catch(e){}}
}
async function guardar(){
  PARTIDOS.sort((a,b)=>a[0]-b[0]);
  if(DB_URL){
    try{const r=await fetch(DB_URL+"/partidos.json",{method:"PUT",body:JSON.stringify(PARTIDOS)});
      if(!r.ok)throw 0;msg("Guardado. Ya lo ve todo el mundo.")}
    catch(e){msg("No se pudo guardar. Revisa las reglas de Firebase.")}
  }else{try{localStorage.setItem(KEY,JSON.stringify(PARTIDOS));msg("Guardado solo en este navegador (falta configurar DB_URL).")}catch(e){}}
}

function calcular(){
  const t={};EQUIPOS.forEach(e=>t[e]={e,pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0});
  PARTIDOS.forEach(([,l,a,b,v])=>{
    const L=t[l],V=t[v];if(!L||!V)return;
    L.pj++;V.pj++;L.gf+=a;L.gc+=b;V.gf+=b;V.gc+=a;
    if(a>b){L.pg++;V.pp++;L.pts+=3}else if(a<b){V.pg++;L.pp++;V.pts+=3}else{L.pe++;V.pe++;L.pts++;V.pts++}
  });
  return Object.values(t).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.e.localeCompare(y.e));
}

function render(){
  const rows=calcular();
  $("tabla").innerHTML=rows.map((r,i)=>{const dg=r.gf-r.gc;
    return `<tr class="${i<2?"top":""}"><td class="eq"><span class="pos">${i+1}</span>${r.e}</td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td><td>${dg>0?"+"+dg:dg}</td><td class="pts">${r.pts}</td></tr>`}).join("");
  const nf=Math.max(0,...PARTIDOS.map(p=>p[0]));
  $("sub").textContent=`${EQUIPOS.length} equipos · ${PARTIDOS.length} partidos jugados · última fecha jugada: ${nf}`;
  const total=Math.max(FECHAS,nf);let h="";
  for(let f=1;f<=total;f++){
    h+=`<div class="fecha"><h3>Fecha ${f}</h3>`;
    let n=0;
    PARTIDOS.forEach((p,i)=>{if(p[0]!==f)return;n++;
      const sc=ADMIN?`<span class="sc"><input type="number" min="0" value="${p[2]}" data-i="${i}" data-k="2"> - <input type="number" min="0" value="${p[3]}" data-i="${i}" data-k="3"></span>`:`<span class="sc">${p[2]} - ${p[3]}</span>`;
      h+=`<div class="m"><span class="l">${p[1]}</span>${sc}<span class="v">${p[4]}</span>${ADMIN?`<button class="x" data-del="${i}">Eliminar</button>`:""}</div>`});
    if(!n)h+=`<div class="m"><span class="note" style="grid-column:1/-1;text-align:center">Por jugar</span></div>`;
    h+="</div>";
  }
  $("fechas").innerHTML=h;
}

function iniciarAdmin(){
  $("adm").hidden=false;
  const opts=EQUIPOS.map(e=>`<option>${e}</option>`).join("");
  $("lo").innerHTML=opts;$("vi").innerHTML=opts;$("vi").selectedIndex=1;
  $("f").innerHTML=Array.from({length:Math.max(FECHAS,20)},(_,i)=>`<option value="${i+1}">Fecha ${i+1}</option>`).join("");
  $("f").value=Math.min(Math.max(1,...PARTIDOS.map(p=>p[0]))+1,Math.max(FECHAS,20));
  $("add").onclick=async()=>{
    const l=$("lo").value,v=$("vi").value,f=+$("f").value;
    if(l===v){alert("Elige dos equipos distintos.");return}
    if(PARTIDOS.some(p=>p[0]===f&&[p[1],p[4]].some(x=>x===l||x===v))&&!confirm("Uno de los equipos ya tiene partido en esa fecha. ¿Agregar de todos modos?"))return;
    PARTIDOS.push([f,l,+$("gl").value||0,+$("gv").value||0,v]);
    await guardar();render();$("gl").value=0;$("gv").value=0;
  };
  $("fechas").onclick=async e=>{const i=e.target.dataset.del;
    if(i!==undefined&&confirm("¿Eliminar este partido?")){PARTIDOS.splice(+i,1);await guardar();render()}};
  $("fechas").onchange=async e=>{const t=e.target;if(t.dataset.k){PARTIDOS[+t.dataset.i][+t.dataset.k]=Math.max(0,+t.value||0);await guardar();render()}};
  $("seed").onclick=async()=>{if(confirm("Esto reemplaza lo guardado por los datos iniciales del archivo. ¿Continuar?")){PARTIDOS=BASE.map(x=>x.slice());await guardar();render()}};
}

(async()=>{
  await cargar();render();
  if(ADMIN){
    if(PIN&&prompt("Clave de administrador:")!==PIN){alert("Clave incorrecta.");location.hash="";return}
    iniciarAdmin();
  }else if(DB_URL){setInterval(async()=>{await cargar();render()},30000)}
})();
window.addEventListener("hashchange",()=>location.reload());
</script>
</body>
</html>
